name: Windows release preparation

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/desktop-build.yml
  prepare-draft:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download verified portable package
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-package
      - name: Archive verified package
        shell: pwsh
        run: |
          Compress-Archive -Path release-package/* -DestinationPath tpd-spectra-windows-x64.zip
          $zipHash = (Get-FileHash tpd-spectra-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  tpd-spectra-windows-x64.zip" | Set-Content -Encoding ascii tpd-spectra-windows-x64.zip.sha256
      - name: Verify release identity and write provenance
        shell: pwsh
        run: |
          $identity = Get-Content release-package/VERSION.json -Raw | ConvertFrom-Json
          if ("v$($identity.version)" -ne $env:GITHUB_REF_NAME) { throw "Tag/application version mismatch" }
          if ($identity.commit -ne $env:GITHUB_SHA) { throw "Tag/executable source commit mismatch" }
          Copy-Item release-package/SHA256SUMS.txt SHA256SUMS.txt
          [ordered]@{
            release_tag = $env:GITHUB_REF_NAME
            version = $identity.version
            source_commit = $identity.commit
            windows_release_workflow_run = $env:GITHUB_RUN_ID
            package_checksum_file = "tpd-spectra-windows-x64.zip.sha256"
            internal_checksums = "SHA256SUMS.txt"
            research_beta = $true
          } | ConvertTo-Json | Set-Content -Encoding utf8 RELEASE-PROVENANCE.json
      - name: Publish research beta assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            tpd-spectra-windows-x64.zip
            tpd-spectra-windows-x64.zip.sha256
            SHA256SUMS.txt
            RELEASE-PROVENANCE.json
          name: TPD Spectra Studio ${{ github.ref_name }} — Research Beta
          draft: false
          prerelease: true
          make_latest: false
