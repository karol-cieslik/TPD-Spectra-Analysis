name: Scientific regression tests

on:
  push:
    branches:
      - feature/kinetic-identifiability-diagnostics
    paths:
      - 'tpd_spectra/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/scientific-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tpd_spectra/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/scientific-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e .
      - name: Run scientific regression tests
        run: python -m pytest -q
