name: Windows desktop build

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact_name:
        description: Verified portable package artifact
        value: ${{ jobs.package.outputs.artifact_name }}
  push:
    branches: [main, 'feature/gui-usability', 'release/beta-v0.11-candidate', 'feature/workflow-redesign', 'release/external-beta-v0.11.0b2', 'release/external-beta-v0.11.0b3']
    paths:
      - 'tpd_spectra/**'
      - 'tests/**'
      - 'examples/**'
      - 'scripts/generate_demo.py'
      - 'scripts/generate_brand_assets.py'
      - 'scripts/verify_windows_build.py'
      - 'scripts/**'
      - 'docs/beta/QUICK_START.pdf'
      - 'docs/beta/RELEASE_NOTES.md'
      - 'START_HERE.md'
      - 'run_tpd_spectra*.py'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'README.md'
      - '.github/workflows/**'
  pull_request:
    branches: [main, 'fix/beta-feedback-14-17']
    paths:
      - 'tpd_spectra/**'
      - 'tests/**'
      - 'scripts/**'
      - 'examples/**'
      - 'docs/**'
      - 'START_HERE.md'
      - 'README.md'
      - 'run_tpd_spectra*.py'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  package:
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install application and packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e .
      - name: Identify beta package and validate release tag
        id: identity
        shell: pwsh
        run: |
          $version = python -c "from tpd_spectra import __version__; print(__version__)"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag must match application version v$version"
          }
          "artifact_name=tpd-spectra-windows-x64-beta-$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Verify scientific and GUI regression tests
        run: python -m pytest -q -rx --junitxml=validation/beta-tests.xml
      - name: Record candidate build identity
        shell: pwsh
        run: |
          python scripts/prepare_windows_beta.py
          python -m pip freeze | Set-Content -Encoding utf8 build-dependencies.txt
      - name: Validate desktop entrypoint without a display
        run: |
          python -c "import tpd_spectra.gui; import tpd_spectra.gui_ranges; import tpd_spectra.identifiability; print('Desktop modules import successfully')"
          python run_tpd_spectra_gui.py --tpd-cli --help
      - name: Validate installable command entry points
        run: |
          tpd-spectra --help
      - name: Build single-file desktop app
        run: >-
          pyinstaller --clean --noconfirm --onefile --windowed
          --name TPD-Spectra-Studio
          --version-file output/windows-version.txt
          --icon tpd_spectra/assets/studio.ico --collect-data tpd_spectra
          --copy-metadata numpy --copy-metadata scipy --copy-metadata pandas --copy-metadata matplotlib
          --hidden-import matplotlib.backends.backend_svg
          --hidden-import matplotlib.backends.backend_pdf
          run_tpd_spectra_gui.py
      - name: Verify frozen executable with shipped demo
        run: python scripts/verify_windows_build.py dist/TPD-Spectra-Studio.exe
      - name: Assemble portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-package | Out-Null
          Copy-Item dist/TPD-Spectra-Studio.exe release-package/
          Copy-Item README.md,CHANGELOG.md,CITATION.cff,LICENSE,ASSET-RIGHTS.md,CONTRIBUTING.md release-package/
          Copy-Item build-dependencies.txt release-package/
          Copy-Item START_HERE.md release-package/
          python -c "import json; from tpd_spectra.identity import build_identity; print(json.dumps(build_identity(),indent=2))" | Set-Content -Encoding utf8 release-package/VERSION.json
          Copy-Item examples release-package/examples -Recurse
          # Ship focused user documentation. Development records remain on GitHub.
          New-Item -ItemType Directory -Force release-package/docs/beta,release-package/docs/redesign,release-package/validation | Out-Null
          Copy-Item validation/WINDOWS_B5_ACCEPTANCE.md release-package/validation/
          $testerDocs = @(
            'docs/USER_AND_SCIENTIFIC_MANUAL.md',
            'docs/METHOD_STATUS.md',
            'docs/ZERO_ORDER_FITTING.md',
            'docs/MULTICOMPONENT_FITTING.md',
            'docs/EXPLORER_MONTE_CARLO.md',
            'docs/SUPPORT_AND_COMPATIBILITY.md',
            'docs/redesign/WORKFLOW_USER_GUIDE.md',
            'docs/beta/QUICK_START.pdf',
            'docs/beta/SCIENTIFIC_HELP_TOPICS.json',
            'docs/beta/WORKED_EXAMPLES.md',
            'docs/beta/WORKED_EXAMPLES.html',
            'docs/beta/RELEASE_NOTES.md',
            'docs/beta/REVIEW_STATUS.md',
            'docs/beta/SHARE_WITH_COLLEAGUES.md',
            'docs/beta/SCIENTIFIC_CONSISTENCY_AUDIT.md',
            'docs/beta/FEEDBACK_FORM.md',
            'docs/beta/TESTER_CHECKLIST.md'
          )
          foreach ($doc in $testerDocs) {
            Copy-Item $doc (Join-Path release-package $doc)
          }
          $exeHash = (Get-FileHash release-package/TPD-Spectra-Studio.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$exeHash  TPD-Spectra-Studio.exe" | Set-Content -Encoding ascii release-package/SHA256SUMS.txt
          @'
          TPD Spectra Studio — development beta (see VERSION.json for version/commit)

          Read START_HERE.md and docs/beta/WORKED_EXAMPLES.html (full tutorial).
          The brief five-page PDF remains at docs/beta/QUICK_START.pdf.
          Extract this entire folder. Double-click TPD-Spectra-Studio.exe.
          Use Open Example Dataset, then the clean first-order example.
          Scientific Help / Parameters explains units, assumptions and seeds offline.
          Zero-order fits report conditional prefactor/scale brackets, not unique values.
          See docs/beta/RELEASE_NOTES.md before interpreting results.
          '@ | Set-Content -Encoding utf8 release-package/QUICKSTART.txt
          @'
          The project-authored software code is offered under the MIT License; see LICENSE.
          No experimental spectra are bundled. This notice does not grant rights to data,
          notebook files, images, or other third-party material. Validate all scientific
          outputs and assumptions before interpretation.
          '@ | Set-Content -Encoding utf8 release-package/DISTRIBUTION-NOTE.txt
          if (!(Test-Path release-package/docs/EXPLORER_MONTE_CARLO.md)) { throw 'Explorer guide missing from package' }
          if (!(Test-Path release-package/docs/USER_AND_SCIENTIFIC_MANUAL.md)) { throw 'User manual missing from package' }
          if (!(Test-Path release-package/docs/beta/QUICK_START.pdf)) { throw 'Quick Start missing from package' }
          if (!(Test-Path release-package/docs/beta/SCIENTIFIC_HELP_TOPICS.json)) { throw 'Scientific Help catalog missing from package' }
          if (!(Test-Path release-package/docs/beta/WORKED_EXAMPLES.html)) { throw 'Worked Quick Start missing from package' }
          New-Item -ItemType Directory -Force release-package/THIRD-PARTY-LICENSES | Out-Null
          $sitePackages = python -c "import site; print(site.getsitepackages()[0])"
          Get-ChildItem $sitePackages -Recurse -File -Include 'LICENSE*','COPYING*' |
            Where-Object { $_.FullName -match '\.dist-info\\' } |
            ForEach-Object {
              $distInfo = Split-Path $_.FullName -Parent
              $packageName = (Split-Path $distInfo -Leaf) -replace '\.dist-info$',''
              Copy-Item $_.FullName (Join-Path 'release-package/THIRD-PARTY-LICENSES' ($packageName + '-' + $_.Name))
            }
      - name: Verify assembled beta resources and offline feedback
        run: python scripts/verify_beta_package.py release-package
      - name: Publish downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: release-package/*
          if-no-files-found: error
          retention-days: 90
