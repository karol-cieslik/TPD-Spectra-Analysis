[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tpd-spectra"
dynamic = ["version"]
authors = [{name = "Karol Cieślik"}]
description = "Interactive desktop workspace and reproducible analysis tools for TPD/TDS spectra"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7"]

[project.scripts]
tpd-spectra = "tpd_spectra.cli:main"
tpd-spectra-gui = "tpd_spectra.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep Windows Tcl file channels intact while capturing Python output. Pytest's
# default OS-descriptor capture can intermittently break init.tcl reads.
# All real Tk assertions remain required on Windows.
addopts = "--capture=sys"

[tool.setuptools.packages.find]
include = ["tpd_spectra*"]
exclude = ["tests*", "scripts*", "input*", "output*", "images*"]

[tool.setuptools.dynamic]
version = {attr = "tpd_spectra.__version__"}

[tool.setuptools.package-data]
tpd_spectra = ["assets/*.png", "assets/*.ico", "assets/*.svg"]
