name: Windows desktop build

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/gui-usability']
    paths:
      - 'tpd_spectra/**'
      - 'tests/**'
      - 'run_tpd_spectra*.py'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'README.md'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install application and packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e .
      - name: Verify scientific and GUI regression tests
        run: python -m pytest -q
      - name: Build single-file desktop app
        run: >-
          pyinstaller --clean --noconfirm --onefile --windowed
          --name TPD-Spectra-Studio
          run_tpd_spectra_gui.py
      - name: Assemble portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-package | Out-Null
          Copy-Item dist/TPD-Spectra-Studio.exe release-package/
          Copy-Item README.md,CHANGELOG.md,CITATION.cff,LICENSE,ASSET-RIGHTS.md release-package/
          @'
          TPD Spectra Studio — Windows x64

          START HERE: double-click TPD-Spectra-Studio.exe. This is the only application file.
          Import CSV files (or a folder), choose spectra, explore the plot, and use
          Export plot PNG or Run full analysis. Batch analysis is built into this app.

          Experimental data are not included. Bring your own CSV spectra. See README.md
          for input formats, analysis assumptions, outputs, and citation information.
          '@ | Set-Content -Encoding utf8 release-package/QUICKSTART.txt
          @'
          The project-authored software code is offered under the MIT License; see LICENSE.
          No experimental spectra are bundled. This notice does not grant rights to data,
          notebook files, images, or other third-party material. Validate all scientific
          outputs and assumptions before interpretation.
          '@ | Set-Content -Encoding utf8 release-package/DISTRIBUTION-NOTE.txt
          New-Item -ItemType Directory -Force release-package/THIRD-PARTY-LICENSES | Out-Null
          $sitePackages = python -c "import site; print(site.getsitepackages()[0])"
          Get-ChildItem $sitePackages -Recurse -File -Include 'LICENSE*','COPYING*' |
            Where-Object { $_.FullName -match '\.dist-info\\' } |
            ForEach-Object {
              $distInfo = Split-Path $_.FullName -Parent
              $packageName = (Split-Path $distInfo -Leaf) -replace '\.dist-info$',''
              Copy-Item $_.FullName (Join-Path 'release-package/THIRD-PARTY-LICENSES' ($packageName + '-' + $_.Name))
            }
      - name: Publish downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: tpd-spectra-windows-x64-${{ github.ref_name == 'main' && 'stable' || 'gui-preview' }}
          path: release-package/*
          if-no-files-found: error
          retention-days: 90
