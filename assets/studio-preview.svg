    <path d="M488 675 C554 676 588 664 628 643 S680 598 716 584 S763 607 800 627 S870 651 924 646 S978 610 1027 553 S1093 431 1135 379 S1172 500 1218 576 S1301 645 1372 666" fill="none" stroke="#059669" stroke-width="3.5"/>
    <path d="M488 698 C553 697 585 680 626 661 S676 631 719 623 S769 637 813 653 S871 675 927 667 S982 641 1035 593 S1104 481 1141 436 S1185 539 1228 610 S1309 675 1372 686" fill="none" stroke="#9333ea" stroke-width="3.5"/>
  </g>
  <text x="908" y="783" fill="#334e68" font-family="Segoe UI,Arial,sans-serif" font-size="13">Temperature (°C)</text><text transform="translate(468 570) rotate(-90)" fill="#334e68" font-family="Segoe UI,Arial,sans-serif" font-size="13">Signal (a.u.)</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569"><text x="475" y="761">0</text><text x="624" y="761">100</text><text x="773" y="761">200</text><text x="922" y="761">300</text><text x="1071" y="761">400</text><text x="1220" y="761">500</text><text x="1363" y="761">600</text></g>
  <rect x="688" y="294" width="303" height="37" rx="8" fill="#fff" stroke="#dce5ef"/><path d="M708 312h21" stroke="#2563eb" stroke-width="3"/><text x="736" y="317" fill="#334e68" font-family="Segoe UI,Arial,sans-serif" font-size="11">sample_01</text><path d="M818 312h21" stroke="#e76f51" stroke-width="3"/><text x="846" y="317" fill="#334e68" font-family="Segoe UI,Arial,sans-serif" font-size="11">sample_02</text><path d="M928 312h21" stroke="#059669" stroke-width="3"/><text x="956" y="317" fill="#334e68" font-family="Segoe UI,Arial,sans-serif" font-size="11">sample_03</text>
</svg>
